name: Build NanoPi M2 Android RetroArch image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git dosfstools parted util-linux xz-utils lz4 zip

      - name: Build official Android 5.1 image
        run: |
          git clone --depth 1 --branch master https://github.com/friendlyarm/sd-fuse_s5p4418.git builder
          cd builder
          export SDFUSE_NONINTERACTIVE=y
          RAW_SIZE_MB=4096 ./mk-sd-image.sh android
          image_file="$(find out -maxdepth 1 -type f -name 's5p4418-sd-android-*.img' -print -quit)"
          if [ -z "$image_file" ]; then image_file="$(find out -maxdepth 1 -type f -name '*android*.img' -print -quit)"; fi
          test -n "$image_file"
          mv "$image_file" ../nanopi-m2-android5.img
          gzip -9 ../nanopi-m2-android5.img

      - name: Download offline RetroArch package
        run: |
          mkdir -p offline-package/RetroArch/cores offline-package/RetroArch/system offline-package/Games/PS1
          curl --fail --location --retry 5 --retry-all-errors https://buildbot.libretro.com/stable/1.19.1/android/RetroArch.apk --output offline-package/RetroArch.apk
          curl --fail --location --retry 5 --retry-all-errors https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/pcsx_rearmed_libretro_android.so.zip --output offline-package/RetroArch/cores/pcsx_rearmed_libretro_android.so.zip
          printf '%s\n' 'NANOPI M2 PS1 OFFLINE PACKAGE' '' '1. Flash nanopi-m2-android5.img.gz to microSD with balenaEtcher.' '2. Copy the contents of this offline package to a separate FAT32 USB drive.' '3. Boot Android and install RetroArch.apk.' '4. In RetroArch use Load Core -> Install or Restore a Core and select the PCSX-ReARMed ZIP.' '5. Put your legally obtained PS1 BIOS in RetroArch/system.' '6. Put your own .bin/.cue, .chd or .pbp games in Games/PS1.' > offline-package/README.txt
          zip -r nanopi-m2-retroarch-offline.zip offline-package
          sha256sum nanopi-m2-android5.img.gz nanopi-m2-retroarch-offline.zip > SHA256SUMS.txt

      - name: Upload Android and RetroArch bundle
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-m2-android-retroarch
          path: |
            nanopi-m2-android5.img.gz
            nanopi-m2-retroarch-offline.zip
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
